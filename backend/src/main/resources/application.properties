# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=semp-backend

# Database Configuration - MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/semp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Akki050207!}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration (Disabled when using MySQL)
spring.h2.console.enabled=false

# Security & JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3a5f6e8d0c2b4a6f8e1d3c5b7a9f2e4d6c8b0a2f4e6d8c0b2a4f
app.jwt.expiration-ms=86400000



# Logging Configuration
logging.level.root=INFO
logging.level.com.semp=DEBUG
logging.level.org.springframework.security=INFO
